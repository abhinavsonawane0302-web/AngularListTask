<div class="container p-2">
  <div class="row">
    <div class="col-12">
      <h3 class="text-center p-3 bg-dark mt-2 text-white">Products List</h3>

      <ul class="list-group">
        <li class="list-group-item bg-light" *ngFor="let pro of products">{{pro}}</li>
      </ul>
    </div>

    <div class="col-12">
      <h3 class="text-center p-3 bg-info mt-2">Fruits List</h3>

      <ul class="list-group">
        <li class="list-group-item bg-light" *ngFor="let fruit of fruits">{{fruit}}</li>
      </ul>
    </div>

    <div class="col-12">
      <h3 class="text-center p-3 bg-dark mt-2 text-white">Colors List</h3>

      <ul class="list-group">
        <li class="list-group-item bg-light" *ngFor="let color of colors">{{color}}</li>
      </ul>
    </div>

    <div class="col-12">
      <h3 class="text-center p-3 bg-info mt-2">Cities List</h3>

      <ul class="list-group">
        <li class="list-group-item bg-light" *ngFor="let city of cities">{{city}}</li>
      </ul>
    </div>

    <div class="col-12">
      <h3 class="text-center p-3 bg-dark mt-2 text-white">Subjects List</h3>

      <ul class="list-group">
        <li class="list-group-item bg-light" *ngFor="let sub of subjects">{{sub}}</li>
      </ul>
    </div>

    <div class="col-12">
      <h3 class="text-center p-3 bg-info mt-2">Vehicles List</h3>

      <ul class="list-group">
        <li class="list-group-item bg-light" *ngFor="let vehi of vehicles">{{vehi}}</li>
      </ul>
    </div>

    <div class="col-12">
      <h3 class="text-center p-3 bg-dark mt-2 text-white">Animals List</h3>

      <ul class="list-group">
        <li class="list-group-item bg-light" *ngFor="let animal of animals">{{animal}}</li>
      </ul>
    </div>

    <div class="col-12">
      <h3 class="text-center p-3 bg-info mt-2">Sports List</h3>

      <ul class="list-group">
        <li class="list-group-item bg-light" *ngFor="let sport of sports">{{sport}}</li>
      </ul>
    </div>

    <div class="col-12">
      <h3 class="text-center p-3 bg-dark mt-2 text-white">Countries List</h3>

      <ul class="list-group">
        <li class="list-group-item bg-light" *ngFor="let country of countries">{{country}}</li>
      </ul>
    </div>

    <div class="col-12">
      <h3 class="text-center p-3 bg-info mt-2">Languages List</h3>

      <ul class="list-group">
        <li class="list-group-item bg-light" *ngFor="let lang of languages">{{lang}}</li>
      </ul>
    </div>
  </div>
</div>
